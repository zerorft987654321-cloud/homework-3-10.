<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - MyPage </title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS ใช้ไฟล์ร่วมกัน -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">MyPage </a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left"></i> กลับสู่หน้าหลัก</a>
            </div>
        </div>
    </nav>

    <!-- Contact Form Section -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow border-0 p-4">
                        <h2 class="text-center fw-bold mb-4">ช่องทางการติดต่อ</h2>
                        
                        <!-- ข้อมูลการติดต่อแบบ Ordered List (ol) -->
                        <ol class="list-group list-group-numbered mb-4 shadow-sm">
                            <li class="list-group-item d-flex justify-content-between align-items-start">
                                <div class="ms-2 me-auto">
                                    <div class="fw-bold">อีเมลสถาบัน</div>
                                    <span>student [at] pim.ac.th</span>
                                </div>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-start">
                                <div class="ms-2 me-auto">
                                    <div class="fw-bold">เบอร์โทรศัพท์</div>
                                    <span>08X-XXX-XXXX</span>
                                </div>
                            </li>
                            <li class="list-group-item d-flex justify-content-between align-items-start">
                                <div class="ms-2 me-auto">
                                    <div class="fw-bold">ที่อยู่</div>
                                    <span>กรุงเทพมหานคร, ประเทศไทย</span>
                                </div>
                            </li>
                        </ol>

                        <h4 class="fw-bold mb-3 text-center">ส่งข้อความถึงเรา</h4>
                        <form>
                            <div class="mb-3">
                                <label for="name" class="form-label">ชื่อ - นามสกุล</label>
                                <input type="text" class="form-control" id="name" placeholder="กรอกชื่อของคุณ" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">อีเมล</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">ข้อความ</label>
                                <textarea class="form-control" id="message" rows="4" placeholder="พิมพ์ข้อความที่ต้องการ..." required></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-dark">ส่งข้อความ</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="fas fa-home"></i> กลับหน้าแรก</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-black text-white text-center py-3">
        <div class="container">
            <p class="mb-0">&copy; 2026 MyPage v2. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
